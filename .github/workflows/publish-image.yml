# Build and publish the everything-included image to GHCR.
#
# GHCR rather than Docker Hub: the repository is already on GitHub, public
# images are free, anonymous pulls are not rate-limited (Docker Hub's 100
# per 6 hours per IP is a real problem when several people behind one
# university NAT try this at once), and GITHUB_TOKEN authenticates the push
# with no secret to manage.
#
#   docker run -d -p 127.0.0.1:8000:8000 ghcr.io/stefdoerr/cidoc-crm-mcp:latest
#
# Triggered by a version tag, or by hand.

name: publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish, e.g. v0.2.0 (blank: :latest only)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  # What this run calls itself: the dispatch input if one was given, else the
  # name of the pushed tag, else `dev`. Both jobs need it -- `build` stamps it
  # into an image label, `manifest` turns it into image tags -- and a
  # workflow-level env is the one place both can read it without threading a
  # job output between them.
  VERSION: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'dev' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            # Native arm64, free for public repos. QEMU is not an option
            # here: emulating a torch build takes hours and routinely times
            # the job out.
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      # A malformed version should cost seconds, not the 40 minutes it takes
      # to reach `imagetools create` with the wheels and the corpus already
      # built. A leading `v` is optional; the tags in `manifest` strip it.
      - name: Check the version
        if: env.VERSION != 'dev'
        run: |
          echo "publishing VERSION=$VERSION"
          [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+.].*)?$ ]] || {
            echo "::error::'$VERSION' is not a semver version (want e.g. v0.2.0)"
            exit 1
          }

      - uses: actions/checkout@v4

      # The runner has ~14GB free and this build wants most of it: 1.4GB of
      # wheels, a 1.4GB venv, an 876MB corpus that is then copied into the
      # runtime stage, a 288MB model, and a ~2.8GB export. Without this the
      # build dies partway through the corpus fetch with a confusing ENOSPC.
      - name: Free disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ env.VERSION }}
          # Registry cache, not type=gha: the GitHub Actions cache is capped
          # at 10GB per repository and these layers alone would thrash it,
          # evicting the 876MB corpus layer that is the whole reason to cache.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }},mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
        env:
          # Unauthenticated Hub pulls are throttled, and this build makes a
          # lot of them: the corpus fetch alone took 212s locally with a warm
          # connection. Set HF_TOKEN as a repository secret. The build still
          # works without it, just slower and at the mercy of the rate limit.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One multi-arch manifest over both digests, so `docker pull` picks the
  # right architecture. Apple Silicon is a large share of the likely audience
  # and an emulated amd64 image would undo the 50-90ms warm-query number that
  # is the point of the CPU build.
  manifest:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # An immutable version tag plus a moving :latest. `value=` is what
          # makes the dispatch path work: left to itself `type=semver` reads
          # the git ref, which on a manual run is a branch, so the version the
          # operator typed was accepted and then silently ignored.
          #
          # `type=raw` stays unconditional on purpose: a manual run with no
          # version must still produce at least one tag, or `imagetools
          # create` is handed an empty -t list and fails at the last step of a
          # 40-minute build.
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }},enable=${{ env.VERSION != 'dev' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ env.VERSION != 'dev' }}
            type=raw,value=latest

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Show what was published
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  # A published image that does not serve is worse than no image. Pull the
  # real artifact from the registry and drive it, rather than trusting that
  # the thing that built is the thing that runs.
  smoke:
    runs-on: ubuntu-24.04
    needs: manifest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and drive it
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          docker pull "$IMAGE"
          docker run -d --name smoke -p 127.0.0.1:8000:8000 "$IMAGE"
          for i in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$st" = healthy ] && break
            [ "$st" = unhealthy ] && { docker logs smoke; exit 1; }
            sleep 5
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] \
            || { docker logs smoke; exit 1; }
          docker logs smoke 2>&1 | grep -i warmed
          docker run --rm "$IMAGE" cat /app/corpus-provenance.json
          python3 tools/smoke_mcp_http.py http://127.0.0.1:8000/mcp
